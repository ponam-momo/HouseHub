<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HouseHub — My Requests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .status-pending  { background: #f39c12; }
    .status-accepted { background: #27ae60; }
    .status-rejected { background: #e74c3c; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark" style="background:#2c3e50;">
  <div class="container">
    <a class="navbar-brand fw-bold" href="search.html">🏠 HouseHub</a>
    <button onclick="logout()" class="btn btn-outline-light btn-sm">Logout</button>
  </div>
</nav>

<div class="container mt-4">
  <div id="tenant-section" class="d-none">
    <h4 class="mb-3">📬 My Rental Requests</h4>
    <div id="my-requests-list"></div>
  </div>

  <div id="owner-section" class="d-none">
    <h4 class="mb-3">📋 Requests on My Listings</h4>
    <div id="owner-requests-list"></div>
  </div>

  <div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
  </div>
</div>

<script>
  const API = 'http://localhost:3000/api';
  const token = localStorage.getItem('hh_token');
  const user = JSON.parse(localStorage.getItem('hh_user') || 'null');

  if (!token || !user) { window.location.href = 'login.html'; }

  function logout() { localStorage.clear(); window.location.href = 'login.html'; }

  async function loadPage() {
    document.getElementById('loading').classList.add('d-none');

    if (user.role === 'tenant') {
      document.getElementById('tenant-section').classList.remove('d-none');
      loadMyRequests();
    } else if (user.role === 'owner') {
      document.getElementById('owner-section').classList.remove('d-none');
      loadOwnerRequests();
    }
  }

  async function loadMyRequests() {
    try {
      const res = await fetch(`${API}/requests/my-requests`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      const container = document.getElementById('my-requests-list');

      if (!data.requests || data.requests.length === 0) {
        container.innerHTML = `<div class="text-center py-5 text-muted">
          <h5>কোনো request নেই।</h5>
          <a href="search.html" class="btn btn-primary mt-2">Listings দেখুন</a></div>`;
        return;
      }

      container.innerHTML = data.requests.map(r => `
        <div class="card mb-3 border-0 shadow-sm">
          <div class="card-body d-flex gap-3 align-items-start">
            <img src="${r.image || 'https://placehold.co/80x80?text=🏠'}"
                 style="width:80px;height:80px;object-fit:cover;border-radius:8px;">
            <div class="flex-grow-1">
              <h6 class="fw-bold mb-1">${r.title}</h6>
              <p class="text-muted small mb-1">📍 ${r.location} | ৳${Number(r.price).toLocaleString()}/mo</p>
              <p class="small mb-1">Owner: ${r.owner_name}</p>
              <span class="badge status-${r.status} text-white">${r.status.toUpperCase()}</span>
              <small class="text-muted ms-2">${new Date(r.created_at).toLocaleDateString('bn-BD')}</small>
            </div>
            ${r.status === 'pending' ? `
              <button class="btn btn-outline-danger btn-sm" onclick="cancelReq(${r.id})">Cancel</button>` : ''}
            ${r.status === 'accepted' ? `
              <div class="text-end">
                <div class="badge bg-success mb-1">✅ Accepted!</div>
                <small class="d-block text-muted">Owner: ${r.owner_name}</small>
              </div>` : ''}
          </div>
        </div>`).join('');
    } catch (e) {
      document.getElementById('my-requests-list').innerHTML =
        `<div class="text-danger">Error loading requests.</div>`;
    }
  }

  async function loadOwnerRequests() {
    try {
      const res = await fetch(`${API}/requests/owner-requests`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      const container = document.getElementById('owner-requests-list');

      if (!data.requests || data.requests.length === 0) {
        container.innerHTML = `<div class="text-center py-5 text-muted">
          <h5>কোনো request আসেনি।</h5></div>`;
        return;
      }

      container.innerHTML = data.requests.map(r => `
        <div class="card mb-3 border-0 shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h6 class="fw-bold mb-1">${r.title}</h6>
                <p class="text-muted small mb-1">📍 ${r.location}</p>
                <p class="small mb-1">Tenant: <strong>${r.tenant_name}</strong>
                  (${r.tenant_email}${r.tenant_phone ? ' | ' + r.tenant_phone : ''})</p>
                <span class="badge status-${r.status} text-white">${r.status.toUpperCase()}</span>
                <small class="text-muted ms-2">${new Date(r.created_at).toLocaleDateString('bn-BD')}</small>
              </div>
              ${r.status === 'pending' ? `
                <div class="d-flex gap-2">
                  <button class="btn btn-success btn-sm" onclick="respond(${r.id}, 'accepted')">✅ Accept</button>
                  <button class="btn btn-danger btn-sm" onclick="respond(${r.id}, 'rejected')">❌ Reject</button>
                </div>` : ''}
            </div>
          </div>
        </div>`).join('');
    } catch (e) {
      document.getElementById('owner-requests-list').innerHTML =
        `<div class="text-danger">Error loading requests.</div>`;
    }
  }

  async function respond(id, action) {
    try {
      const res = await fetch(`${API}/requests/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ action })
      });
      const data = await res.json();
      alert(data.message || 'Done');
      loadOwnerRequests();
    } catch { alert('Error'); }
  }

  async function cancelReq(id) {
    if (!confirm('এই request cancel করবেন?')) return;
    try {
      const res = await fetch(`${API}/requests/${id}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();
      alert(data.message || 'Cancelled');
      loadMyRequests();
    } catch { alert('Error'); }
  }

  loadPage();
</script>
</body>
</html>
