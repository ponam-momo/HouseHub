<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | HouseHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f1f5f9;
    }
    .navbar-custom {
      background: #1e293b;
    }
    .stat-card {
      border-radius: 10px;
      border: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark navbar-custom px-4">
    <span class="navbar-brand mb-0 h1">HouseHub Admin</span>
    <div>
      <span id="adminName" class="text-white me-3"></span>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
    </div>
  </nav>

  <div class="container mt-4">
    <h4 class="mb-4">Welcome, <span id="welcomeName">Admin</span>! 👋</h4>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card stat-card p-3">
          <h6 class="text-muted">Total Users</h6>
          <h3 id="userCount">--</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card p-3">
          <h6 class="text-muted">Total Listings</h6>
          <h3 id="listingCount">--</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card p-3">
          <h6 class="text-muted">Status</h6>
          <h3 class="text-success">✅ Connected</h3>
        </div>
      </div>
    </div>

    <div class="alert alert-info">
      Admin login ar dashboard successfully kaj korche। User ar Listing list dekhার feature pore add kora hবে।
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3001/api';
    const token = localStorage.getItem('adminToken');
    const adminInfo = JSON.parse(localStorage.getItem('adminInfo') || '{}');

    // ── Login na thakলে ferot pাঠाও ──
    if (!token) {
      window.location.href = 'login.html';
    }

    // ── Admin naam dekhাও ──
    document.getElementById('adminName').textContent = adminInfo.name || 'Admin';
    document.getElementById('welcomeName').textContent = adminInfo.name || 'Admin';

    // ── Logout ──
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminInfo');
      window.location.href = 'login.html';
    });

    // ── Stats load koro (users + listings count) ──
    async function loadStats() {
      try {
        const usersRes = await fetch(`${API_BASE}/admin/users`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (usersRes.ok) {
          const users = await usersRes.json();
          document.getElementById('userCount').textContent = users.length;
        }

        const listingsRes = await fetch(`${API_BASE}/admin/listings`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (listingsRes.ok) {
          const listings = await listingsRes.json();
          document.getElementById('listingCount').textContent = listings.length;
        }
      } catch (err) {
        console.error('Stats load error:', err);
      }
    }

    loadStats();
  </script>

</body>
</html>
