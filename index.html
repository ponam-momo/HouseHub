<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HouseHub - Auth Demo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <h1 class="mb-4 text-center">HouseHub</h1>

  <div class="row justify-content-center">
    <div class="col-md-5">

      <!-- Register Card -->
      <div class="card mb-4">
        <div class="card-body">
          <h5 class="card-title">Sign Up</h5>
          <input id="regName" class="form-control mb-2" placeholder="Name">
          <input id="regEmail" class="form-control mb-2" placeholder="Email">
          <input id="regPassword" type="password" class="form-control mb-2" placeholder="Password">
          <input id="regPhone" class="form-control mb-2" placeholder="Phone">
          <select id="regRole" class="form-control mb-2">
            <option value="tenant">Tenant</option>
            <option value="owner">Owner</option>
          </select>
          <button class="btn btn-primary w-100" onclick="register()">Register</button>
          <p id="regMsg" class="mt-2 mb-0"></p>
        </div>
      </div>

      <!-- Login Card -->
      <div class="card mb-4">
        <div class="card-body">
          <h5 class="card-title">Login</h5>
          <input id="loginEmail" class="form-control mb-2" placeholder="Email">
          <input id="loginPassword" type="password" class="form-control mb-2" placeholder="Password">
          <button class="btn btn-success w-100" onclick="login()">Login</button>
          <p id="loginMsg" class="mt-2 mb-0"></p>
        </div>
      </div>

      <!-- Profile Card -->
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">My Profile</h5>
          <button class="btn btn-secondary w-100 mb-2" onclick="getProfile()">View Profile</button>
          <pre id="profileBox" class="bg-white p-2 border"></pre>

          <hr>
          <input id="updateName" class="form-control mb-2" placeholder="New Name">
          <input id="updatePhone" class="form-control mb-2" placeholder="New Phone">
          <button class="btn btn-warning w-100" onclick="updateProfile()">Update Profile</button>
          <p id="updateMsg" class="mt-2 mb-0"></p>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
let token = "";
const BASE = "http://localhost:3000";

async function register() {
  const res = await fetch(BASE + "/api/auth/register", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      name: document.getElementById("regName").value,
      email: document.getElementById("regEmail").value,
      password: document.getElementById("regPassword").value,
      phone: document.getElementById("regPhone").value,
      role: document.getElementById("regRole").value
    })
  });
  const data = await res.json();
  document.getElementById("regMsg").innerText = JSON.stringify(data);
}

async function login() {
  const res = await fetch(BASE + "/api/auth/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      email: document.getElementById("loginEmail").value,
      password: document.getElementById("loginPassword").value
    })
  });
  const data = await res.json();
  if (data.token) {
    token = data.token;
    document.getElementById("loginMsg").innerText = "Login successful! Token saved.";
  } else {
    document.getElementById("loginMsg").innerText = JSON.stringify(data);
  }
}

async function getProfile() {
  const res = await fetch(BASE + "/api/user/profile", {
    headers: {"Authorization": "Bearer " + token}
  });
  const data = await res.json();
  document.getElementById("profileBox").innerText = JSON.stringify(data, null, 2);
}

async function updateProfile() {
  const res = await fetch(BASE + "/api/user/profile", {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({
      name: document.getElementById("updateName").value,
      phone: document.getElementById("updatePhone").value
    })
  });
  const data = await res.json();
  document.getElementById("updateMsg").innerText = JSON.stringify(data);
}
</script>
</body>
</html>
